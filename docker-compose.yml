name: horoi-judge

x-frontend: &frontend
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
      HOROI_API_ORIGIN: http://backend:8787
      NEXT_PUBLIC_HOROI_DEMO_MODE: "true"
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
  depends_on:
    backend:
      condition: service_healthy
  networks:
    - private
    - edge
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 128
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0750
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 6

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      NETWORK_ID: zebra-regtest
      HOROI_DEMO_MODE: "true"
      DATABASE_PATH: /data/horoi.db
      VERIFIER_PATH: /usr/local/bin/horoi-verifier
    volumes:
      - horoi_data:/data
    networks:
      - private
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
  frontend:
    <<: *frontend
    ports:
      - "127.0.0.1:3000:3000"
  frontend-public:
    <<: *frontend
    profiles:
      - public
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  horoi_data:

networks:
  private:
    internal: true
  edge:
    driver: bridge
